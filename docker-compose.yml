services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - imoveis-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  imoveis-cli:
    build: .
    container_name: imoveis-database-imoveis-cli-1
    user: "1000:1000"
    restart: "no"
    stdin_open: true
    tty: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DRIVE_DIR: /home/pedrocrqs/majesto-drive
    volumes:
      - ./data:/app/data
      - /home/pedrocrqs/majesto-drive:/home/pedrocrqs/majesto-drive:rshared
    depends_on:
      db:
        condition: service_healthy
    networks:
      - imoveis-net

  wpp-account1:
    user: "1000:1000"
    build: ../wpp-scheduler
    command: ["account1"]
    shm_size: '2gb'
    restart: unless-stopped
    environment:
      - INSTANCE=account1
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ../wpp-scheduler/data:/app/data  # <--- SEPARADO (wpp1)
    depends_on:
      db:
        condition: service_healthy
    networks:
      - imoveis-net

  wpp-account2:
    build: ../wpp-scheduler
    user: "1000:1000"
    shm_size: '2gb'
    command: ["account2"]
    restart: unless-stopped
    environment:
      - INSTANCE=account2
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ../wpp-scheduler/data:/app/data  # <--- SEPARADO (wpp2)
    depends_on:
      db:
        condition: service_healthy
    networks:
      - imoveis-net

  wpp-account3:
    user: "1000:1000"
    shm_size: '2gb'
    build: ../wpp-scheduler
    command: ["account3"]
    restart: unless-stopped
    environment:
      - INSTANCE=account3
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ../wpp-scheduler/data:/app/data  # <--- SEPARADO (wpp3)
    depends_on:
      db:
        condition: service_healthy
    networks:
      - imoveis-net
networks:
  imoveis-net:
    driver: bridge

volumes:
  pgdata:
