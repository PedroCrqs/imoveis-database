services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - imoveis-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Porta exposta só em localhost, não na rede pública — uso é acesso
    # administrativo via túnel SSH (ex: `ssh -L 5432:localhost:5432 servidor`),
    # nunca direto pela internet. Remova se nem isso for necessário.
    ports:
      - "127.0.0.1:5432:5432"

  imoveis-cli:
    build: .
    restart: "no" # é um CLI interativo, não um serviço de longa duração
    stdin_open: true
    tty: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DRIVE_DIR: /drive
    volumes:
      - ./data:/app/data
      - ${DRIVE_DIR_HOST}:/drive
    depends_on:
      db:
        condition: service_healthy
    networks:
      - imoveis-net

  # ── Os 3 serviços abaixo ficam de fora até você trazer o código deles.
  # Todos compartilham a mesma rede `imoveis-net` e falam com o Postgres
  # via DATABASE_URL, apontando para o host interno "db" (nunca "localhost").
  #
  # site:
  #   build: ../site
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   networks:
  #     - imoveis-net
  #   ports:
  #     - "8000:8000"
  #
  # robo-disparo:
  #   build: ../robo-disparo
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   networks:
  #     - imoveis-net
  #
  # sentinela:
  #   build: ../sentinela
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   networks:
  #     - imoveis-net

networks:
  imoveis-net:
    driver: bridge

volumes:
  pgdata:
